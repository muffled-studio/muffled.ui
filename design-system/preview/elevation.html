<!doctype html>
<html><head><meta charset="utf-8"><title>elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items:flex-start; }
  .stack { position:relative; height: 110px; }
  .layer {
    position:absolute; left:20px; right:20px;
    background: var(--paper);
    border: 0.5px solid rgba(26,26,26,0.24);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 11px;
  }
  .l1 { top: 8px; }
  .l2 { top: 38px; }
  .l3 { top: 68px; background: var(--paper); }
  .label { font-size: 11px; }
  .name { font-weight: 600; }
  .val { color: var(--ink-56); font-size: 10px; }
  .rule { font-size: 11px; color: var(--ink-56); grid-column: 1 / -1; }
  .x { font-size: 36px; line-height: 1; color: var(--ink-24); font-weight: 300; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">elevation · no shadows</div>
  <div class="grid">
    <div class="col">
      <div class="stack">
        <div class="layer l1">page</div>
        <div class="layer l2">popover</div>
        <div class="layer l3" style="border-color: rgba(26,26,26,0.56)">menu</div>
      </div>
      <div class="label"><div class="name">stack with hairline</div><div class="val">order + 0.5px border do the work</div></div>
    </div>
    <div class="col" style="align-items:center; justify-content:center; min-height: 110px;">
      <div class="x">∅</div>
      <div class="label" style="text-align:center"><div class="name">no shadow system</div><div class="val">--shadow doesn't exist</div></div>
    </div>
  </div>
  <div class="rule">if a popover needs to feel above the page: paper bg, 0.5px border, let the surface beneath stay still.</div>
</div>
</body></html>
