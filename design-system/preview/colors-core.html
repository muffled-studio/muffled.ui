<!doctype html>
<html><head><meta charset="utf-8"><title>colors — core</title>
<link rel="stylesheet" href="_card.css">
<style>
  .swatch { width: 100%; height: 80px; border-radius: 6px; border: 0.5px solid var(--ink-24); display:flex; align-items:flex-end; padding: 8px 10px; }
  .swatch-row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .meta { display:flex; justify-content:space-between; font-size:10px; letter-spacing:0.02em; }
  .meta .name { font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">core · two colours</div>
  <div class="swatch-row">
    <div class="col">
      <div class="swatch" style="background:#1A1A1A; border-color: rgba(0,0,0,0.1);"></div>
      <div class="meta"><span class="name">ink</span><span class="kv">#1A1A1A · --ink</span></div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#F5F5F5;"></div>
      <div class="meta"><span class="name">paper</span><span class="kv">#F5F5F5 · --paper</span></div>
    </div>
  </div>
</div>
</body></html>
