<!doctype html>
<html><head><meta charset="utf-8"><title>type — code</title>
<link rel="stylesheet" href="_card.css">
<style>
  .pre {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.55;
    background: rgba(26,26,26,0.06);
    border: 0.5px solid rgba(26,26,26,0.12);
    border-radius: 6px;
    padding: 12px 14px;
    white-space: pre;
  }
  .inline {
    font-family: var(--font-mono);
    font-size: 12px;
    background: rgba(26,26,26,0.06);
    border: 0.5px solid rgba(26,26,26,0.12);
    border-radius: 6px;
    padding: 1px 5px;
  }
  .line { font-size: 13px; line-height: 1.7; }
  .c-key { color: var(--ink); }
  .c-str { color: #2471A3; }
  .c-com { color: rgba(26,26,26,0.56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">code · same family, just smaller</div>
  <div class="line">inline like <span class="inline">--ink</span> or <span class="inline">var(--paper)</span> reads quietly inside a sentence.</div>
  <div class="pre"><span class="c-com">/* one rule */</span>
:root {
  <span class="c-key">--ink</span>: <span class="c-str">#1A1A1A</span>;
  <span class="c-key">--paper</span>: <span class="c-str">#F5F5F5</span>;
  <span class="c-key">--bw</span>: <span class="c-str">0.5px</span>;
}</div>
</div>
</body></html>
