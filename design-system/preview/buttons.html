<!doctype html>
<html><head><meta charset="utf-8"><title>buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:flex; flex-wrap: wrap; gap: 10px; align-items:center; }
  button {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 8px 14px;
    border-radius: 6px;
    border: 0.5px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    transition: opacity 90ms cubic-bezier(0.2,0,0,1);
  }
  button:hover { opacity: 0.6; }
  button:active { opacity: 0.4; }
  .secondary { background: transparent; color: var(--ink); border-color: rgba(26,26,26,0.56); }
  .ghost { background: transparent; color: var(--ink); border-color: transparent; }
  .ghost:hover { background: rgba(26,26,26,0.06); opacity: 1; }
  .danger { background: transparent; color: #C0392B; border-color: #C0392B; }
  .sm { font-size: 11px; padding: 5px 10px; }
  .md { font-size: 12px; padding: 8px 14px; }
  .lg { font-size: 13px; padding: 11px 18px; }
  .meta { font-size: 11px; color: var(--ink-56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">buttons</div>
  <div class="grid">
    <button class="md">ship it</button>
    <button class="md secondary">save</button>
    <button class="md ghost">cancel</button>
    <button class="md danger">delete</button>
  </div>
  <div class="grid">
    <button class="sm">sm</button>
    <button class="md">md · default</button>
    <button class="lg">lg</button>
    <button class="md secondary" disabled style="opacity:0.4; cursor:not-allowed">disabled</button>
  </div>
  <div class="meta">hover → 0.6 opacity. press → 0.4. no scale, no shadow.</div>
</div>
</body></html>
