<!doctype html>
<html><head><meta charset="utf-8"><title>spacing — 4px scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display:flex; flex-direction:column; gap: 6px; }
  .row { display:grid; grid-template-columns: 60px 60px 1fr; gap: 12px; align-items:center; font-size: 11px; }
  .bar { height: 10px; background: #1A1A1A; border-radius: 2px; }
  .name { font-weight:600; }
  .val { color: var(--ink-56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">spacing · base 4</div>
  <div class="scale">
    <div class="row"><div class="name">--s-1</div><div class="val">4</div><div class="bar" style="width:4px"></div></div>
    <div class="row"><div class="name">--s-2</div><div class="val">8</div><div class="bar" style="width:8px"></div></div>
    <div class="row"><div class="name">--s-3</div><div class="val">12</div><div class="bar" style="width:12px"></div></div>
    <div class="row"><div class="name">--s-4</div><div class="val">16</div><div class="bar" style="width:16px"></div></div>
    <div class="row"><div class="name">--s-5</div><div class="val">20</div><div class="bar" style="width:20px"></div></div>
    <div class="row"><div class="name">--s-6</div><div class="val">24</div><div class="bar" style="width:24px"></div></div>
    <div class="row"><div class="name">--s-8</div><div class="val">32</div><div class="bar" style="width:32px"></div></div>
    <div class="row"><div class="name">--s-10</div><div class="val">40</div><div class="bar" style="width:40px"></div></div>
    <div class="row"><div class="name">--s-12</div><div class="val">48</div><div class="bar" style="width:48px"></div></div>
    <div class="row"><div class="name">--s-16</div><div class="val">64</div><div class="bar" style="width:64px"></div></div>
    <div class="row"><div class="name">--s-20</div><div class="val">80</div><div class="bar" style="width:80px"></div></div>
    <div class="row"><div class="name">--s-24</div><div class="val">96</div><div class="bar" style="width:96px"></div></div>
  </div>
</div>
</body></html>
