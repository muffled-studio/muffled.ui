<!doctype html>
<html><head><meta charset="utf-8"><title>logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 0; align-items:stretch; border: 0.5px solid rgba(26,26,26,0.24); border-radius: 6px; overflow: hidden; }
  .panel { padding: 24px; display:flex; align-items:center; justify-content:center; min-height: 160px; }
  .panel.light { background: #F5F5F5; }
  .panel.dark { background: #1A1A1A; }
  .panel img { width: 96px; height: 96px; }
  .meta { display:flex; justify-content: space-between; font-size: 11px; }
  .name { font-weight: 600; }
  .val { color: var(--ink-56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">logo · two colours · never below 24px</div>
  <div class="grid">
    <div class="panel light"><img src="../assets/logo-light.svg" alt="muffled.studio on paper" /></div>
    <div class="panel dark"><img src="../assets/logo-dark.svg" alt="muffled.studio on ink" /></div>
  </div>
  <div class="meta"><span class="name">cuboid body · swappable crown · fading legs</span><span class="val">logo-light.svg · logo-dark.svg</span></div>
</div>
</body></html>
