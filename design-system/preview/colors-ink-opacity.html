<!doctype html>
<html><head><meta charset="utf-8"><title>colors — ink opacity</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .stop { display:flex; flex-direction:column; gap:6px; }
  .sw { height: 56px; border-radius: 6px; border: 0.5px solid var(--ink-12); }
  .lbl { font-size: 10px; font-weight:600; }
  .sub { font-size: 10px; color: var(--ink-56); }
  .note { font-size: 11px; color: var(--ink-56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">ink · opacity stops on paper</div>
  <div class="grid">
    <div class="stop"><div class="sw" style="background:rgba(26,26,26,1)"></div><div class="lbl">ink</div><div class="sub">100</div></div>
    <div class="stop"><div class="sw" style="background:rgba(26,26,26,0.90)"></div><div class="lbl">/90</div><div class="sub">fg-1</div></div>
    <div class="stop"><div class="sw" style="background:rgba(26,26,26,0.72)"></div><div class="lbl">/72</div><div class="sub">fg-2</div></div>
    <div class="stop"><div class="sw" style="background:rgba(26,26,26,0.56)"></div><div class="lbl">/56</div><div class="sub">fg-3</div></div>
    <div class="stop"><div class="sw" style="background:rgba(26,26,26,0.40)"></div><div class="lbl">/40</div><div class="sub">fg-4</div></div>
    <div class="stop"><div class="sw" style="background:rgba(26,26,26,0.24)"></div><div class="lbl">/24</div><div class="sub">border</div></div>
    <div class="stop"><div class="sw" style="background:rgba(26,26,26,0.12)"></div><div class="lbl">/12</div><div class="sub">faint</div></div>
  </div>
  <div class="note">no gray ramp. hierarchy is opacity on ink against paper.</div>
</div>
</body></html>
