<!doctype html>
<html><head><meta charset="utf-8"><title>iconography</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .icon { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
  .group { display: flex; gap: 12px; align-items: center; padding: 6px 10px; border: 0.5px solid rgba(26,26,26,0.12); border-radius: 6px; font-size: 11px; }
  .meta { font-size: 11px; color: var(--ink-56); }
  .uni { font-family: var(--font-mono); font-size: 16px; }
  .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #D4830A; }
  .flag::before { content: "⚑"; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">iconography · text-first</div>
  <div class="row">
    <div class="group">
      <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
      <span>home</span>
    </div>
    <div class="group">
      <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <span>search</span>
    </div>
    <div class="group">
      <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
      <span>file</span>
    </div>
    <div class="group">
      <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      <span>settings</span>
    </div>
  </div>
  <div class="row">
    <div class="group"><span class="uni">→</span><span>next</span></div>
    <div class="group"><span class="uni">←</span><span>back</span></div>
    <div class="group"><span class="uni">·</span><span>bullet</span></div>
    <div class="group"><span class="uni">✓</span><span>done</span></div>
    <div class="group"><span class="uni">✕</span><span>close</span></div>
  </div>
  <div class="flag">lucide is a placeholder. swap in custom set when available.</div>
  <div class="meta">stroke 1.5 · currentcolor only · 12 / 16 / 20 / 24 px · 8px gap to label · no emoji.</div>
</div>
</body></html>
