<!doctype html>
<html><head><meta charset="utf-8"><title>voice</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col h { display:block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-56); margin-bottom: 8px; }
  .yes h, .no h { font-weight: 600; }
  .yes h { color: #27AE60; }
  .no h { color: #C0392B; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  li { font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding-left: 14px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 0; border-top: 0.5px solid var(--ink-56); }
  .no li { color: var(--ink-56); text-decoration: line-through; text-decoration-thickness: 0.5px; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">voice · dry · precise · direct</div>
  <div class="grid">
    <div class="col yes">
      <h>we say</h>
      <ul>
        <li>we build things. mostly software.</li>
        <li>shipped. small. useful.</li>
        <li>this is a draft. it works.</li>
      </ul>
    </div>
    <div class="col no">
      <h>we don't</h>
      <ul>
        <li>we're so excited to announce!</li>
        <li>you'll love how easy it is</li>
        <li>revolutionary new way to build</li>
      </ul>
    </div>
  </div>
</div>
</body></html>
