<!doctype html>
<html><head><meta charset="utf-8"><title>type — display</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; align-items:baseline; gap:16px; padding: 6px 0; border-top: 0.5px solid var(--ink-12); }
  .row:first-of-type { border-top: 0; }
  .meta { font-family: var(--font-sans); font-size: 10px; color: var(--ink-56); flex: none; width: 120px; letter-spacing: 0.02em; }
  .glyph { font-family: var(--font-mono); }
  .h1 { font-size: 44px; font-weight: 400; line-height: 1.1; letter-spacing: -0.04em; }
  .h2 { font-size: 34px; font-weight: 400; line-height: 1.1; letter-spacing: -0.03em; }
  .h3 { font-size: 26px; font-weight: 400; line-height: 1.2; letter-spacing: -0.02em; }
  .h4 { font-size: 20px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">display · space mono</div>
  <div class="row"><div class="meta">h1 · 44 / 400</div><div class="glyph h1">we build things.</div></div>
  <div class="row"><div class="meta">h2 · 34 / 400</div><div class="glyph h2">mostly software.</div></div>
  <div class="row"><div class="meta">h3 · 26 / 400</div><div class="glyph h3">some of it ships.</div></div>
  <div class="row"><div class="meta">h4 · 20 / 700</div><div class="glyph h4">small. useful. true.</div></div>
</div>
</body></html>
