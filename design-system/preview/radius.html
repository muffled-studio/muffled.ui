<!doctype html>
<html><head><meta charset="utf-8"><title>radius</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .demo { aspect-ratio: 1.6/1; border: 0.5px solid var(--ink-56); display:flex; align-items:flex-end; padding: 8px; }
  .meta { font-size: 11px; }
  .name { font-weight: 600; }
  .val { color: var(--ink-56); font-size: 10px; }
  .note { font-size: 11px; color: var(--ink-56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">radius · held loosely</div>
  <div class="grid">
    <div class="col">
      <div class="demo" style="border-radius: 0;"></div>
      <div class="meta"><div class="name">--r-0</div><div class="val">0px · stamped</div></div>
    </div>
    <div class="col">
      <div class="demo" style="border-radius: 6px;"></div>
      <div class="meta"><div class="name">--r</div><div class="val">6px · default</div></div>
    </div>
    <div class="col">
      <div class="demo" style="border-radius: 999px;"></div>
      <div class="meta"><div class="name">--r-pill</div><div class="val">999px · round only</div></div>
    </div>
    <div class="col">
      <div class="demo" style="border-radius: 50%;"></div>
      <div class="meta"><div class="name">circle</div><div class="val">avatars · dots</div></div>
    </div>
  </div>
  <div class="note">6px is default. 0px is also fine. don't invent values between.</div>
</div>
</body></html>
