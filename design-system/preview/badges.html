<!doctype html>
<html><head><meta charset="utf-8"><title>badges</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    padding: 3px 8px;
    border-radius: 6px;
    border: 0.5px solid currentColor;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .b-default { color: rgba(26,26,26,0.72); }
  .b-red { color: #C0392B; }
  .b-green { color: #27AE60; }
  .b-amber { color: #D4830A; }
  .b-blue { color: #2471A3; }
  .filled { background: #1A1A1A; color: #F5F5F5; border-color: #1A1A1A; }
  .meta { font-size: 11px; color: var(--ink-56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">badges · status</div>
  <div class="row">
    <span class="badge b-default"><span class="dot"></span>draft</span>
    <span class="badge b-green"><span class="dot"></span>shipped</span>
    <span class="badge b-amber"><span class="dot"></span>in progress</span>
    <span class="badge b-red"><span class="dot"></span>blocked</span>
    <span class="badge b-blue"><span class="dot"></span>reference</span>
  </div>
  <div class="row">
    <span class="badge filled">v0.1</span>
    <span class="badge b-default">tag</span>
    <span class="badge b-default">internal</span>
    <span class="badge b-default">small</span>
    <span class="badge b-default">tiny</span>
  </div>
  <div class="meta">utility hue + dot + lowercase label. that's it.</div>
</div>
</body></html>
