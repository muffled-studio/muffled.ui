<!doctype html>
<html><head><meta charset="utf-8"><title>motion</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .lane { position:relative; height: 60px; border-radius: 6px; border: 0.5px solid rgba(26,26,26,0.24); padding: 8px; overflow: hidden; }
  .ball {
    position:absolute; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 6px; background: #1A1A1A;
  }
  .b-drift { animation: drift 2.4s var(--ease-drift, cubic-bezier(0.4,0,0.2,1)) infinite alternate; }
  .b-snap { animation: snap 1.6s steps(2, end) infinite; }
  @keyframes drift { from { left: 8px; } to { left: calc(100% - 32px); } }
  @keyframes snap { 0%,49% { left: 8px; } 50%,100% { left: calc(100% - 32px); } }
  .label { font-size: 11px; }
  .name { font-weight: 600; }
  .val { color: var(--ink-56); font-size: 10px; }
  .rule { font-size: 11px; color: var(--ink-56); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">motion · drift · snap · nothing bounces</div>
  <div class="grid">
    <div class="col">
      <div class="lane"><div class="ball b-drift"></div></div>
      <div class="label"><div class="name">drift · 220ms · cubic-bezier(0.4,0,0.2,1)</div><div class="val">transitions, mounts, theme swaps</div></div>
    </div>
    <div class="col">
      <div class="lane"><div class="ball b-snap"></div></div>
      <div class="label"><div class="name">snap · 90ms · cubic-bezier(0.2,0,0,1)</div><div class="val">press, release, toggle</div></div>
    </div>
  </div>
  <div class="rule">no spring overshoot. no wobble. nothing keyframed on chrome.</div>
</div>
</body></html>
