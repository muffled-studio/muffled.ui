<!doctype html>
<html><head><meta charset="utf-8"><title>cards</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .demo {
    background: var(--paper);
    border: 0.5px solid rgba(26,26,26,0.24);
    border-radius: 6px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .demo .t { font-size: 14px; font-weight: 500; }
  .demo .d { font-size: 11px; color: var(--ink-72); line-height: 1.55; }
  .demo .m { font-size: 10px; color: var(--ink-56); letter-spacing: 0.04em; text-transform: lowercase; }
  .recipe { font-size: 11px; color: var(--ink-56); line-height: 1.7; }
  .recipe code { font-family: var(--font-mono); background: rgba(26,26,26,0.06); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">cards · the whole recipe</div>
  <div class="grid">
    <div class="demo">
      <div class="m">project · 04</div>
      <div class="t">a small cli for tracking todos</div>
      <div class="d">written in an afternoon. uses sqlite. has a man page.</div>
    </div>
    <div class="demo">
      <div class="m">note</div>
      <div class="t">on shipping less</div>
      <div class="d">the smallest version that's true is usually the right one.</div>
    </div>
  </div>
  <div class="recipe">paper · <code>0.5px</code> border at <code>ink/24</code> · <code>6px</code> radius · padding from the 4px scale · no shadow.</div>
</div>
</body></html>
